<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privency — Boîte à outils commerciale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Aligné sur le rendu de l'app (app.html) */
  --creme:#FAF9F6; --encre:#14171F; --or:#8F7015; --or-clair:#C9A227;
  --texte:#14171F; --gris:#6E6A5C; --bord:#E7E3D8; --radius:14px; --shadow:0 2px 8px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--texte);font-family:'Work Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
.serif{font-family:'Playfair Display',Georgia,serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:10;background:var(--creme);border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-family:'Playfair Display',serif;font-weight:600;font-size:1.3rem;letter-spacing:.01em;flex:0 0 auto;margin-right:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 12px;border-radius:999px;font-size:.85rem;font-weight:500;color:var(--gris);border:1px solid transparent}
.tab[aria-selected="true"]{background:var(--encre);color:var(--creme)}
.tab:not([aria-selected="true"]):hover{border-color:var(--bord);color:var(--texte)}

main{max-width:760px;margin:0 auto;padding:0 16px 80px}
.kicker{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--or)}
.on-dark .kicker{color:var(--or-clair)}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;line-height:1.1}
.hero{padding:40px 0 24px}
.hero h1{font-size:clamp(1.9rem,7vw,2.9rem);margin:10px 0 12px}
.hero h1 em{color:var(--or)}
.hero p{color:var(--gris);max-width:52ch}

.choices{display:grid;gap:12px;margin-top:20px}
@media(min-width:600px){.choices{grid-template-columns:1fr 1fr}}
.choice{text-align:left;padding:22px;border-radius:var(--radius);border:1px solid var(--bord);background:#fff;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s;display:flex;flex-direction:column;gap:6px}
.choice:hover{transform:translateY(-2px);border-color:var(--or-clair)}
.choice.dark{background:var(--encre);color:var(--creme);border-color:var(--encre)}
.choice h3{font-size:1.45rem}
.choice small{font-size:.9rem;opacity:.75}
.choice .go{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or)}
.choice.dark .go{color:var(--or-clair)}

.hint{margin-top:28px;padding:16px;border:1px dashed var(--bord);border-radius:12px;color:var(--gris);font-size:.9rem;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hint button{color:var(--or);font-weight:700;white-space:nowrap}

/* Parcours */
.progress{display:flex;gap:6px;margin:24px 0 8px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--bord);transition:background .3s}
.progress i.done{background:var(--or-clair)}
.progress i.now{background:var(--encre)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back{color:var(--gris);font-size:.85rem;white-space:nowrap}
.back:hover{color:var(--texte)}

.card{border:1px solid var(--bord);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card,.obj-a{animation:none}}
.card-h{padding:24px 22px 8px}
.card-h h2{font-size:clamp(1.55rem,5.2vw,2.05rem);font-style:italic;margin-top:8px}
.say{background:var(--encre);color:var(--creme);padding:22px;margin-top:16px}
.say blockquote{font-family:'Playfair Display',serif;font-style:italic;font-size:1.2rem;line-height:1.35;margin:8px 0 14px}
.say blockquote::before{content:"“";color:var(--or-clair)}
.say blockquote::after{content:"”";color:var(--or-clair)}
.copy{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or-clair);border:1px solid var(--or-clair);padding:7px 12px;border-radius:999px}
.copy:hover{background:var(--or-clair);color:var(--encre)}
.show{padding:18px 22px;border-top:1px solid var(--bord);display:block}
.show .lab{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{border:1px solid var(--or);color:var(--or);border-radius:999px;padding:5px 13px;font-size:.82rem;font-weight:500;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--or-clair);border-color:var(--or-clair);color:var(--encre)}
.chip:hover{background:var(--or-clair);color:var(--encre)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--or);display:block;margin-top:2px}
.why{border-top:1px solid var(--bord)}
.why summary{list-style:none;padding:16px 22px;cursor:pointer;display:flex;justify-content:space-between;font-weight:500}
.why summary::-webkit-details-marker{display:none}
.why summary::after{content:"+";color:var(--or);font-size:1.3rem;line-height:1}
.why[open] summary::after{content:"–"}
.why p{padding:0 22px 20px;color:#3a3833}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{padding:14px 20px;border-radius:999px;font-weight:700;border:1px solid var(--encre);transition:background .2s,color .2s}
.btn.primary{background:var(--encre);color:var(--creme);flex:1}
.btn.primary:hover{background:var(--or-clair);border-color:var(--or-clair);color:var(--encre)}
.btn.ghost:hover{background:var(--encre);color:var(--creme)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.recap{padding:24px 22px;background:var(--encre);color:var(--creme);border-radius:16px;animation:in .35s ease both}
.recap h2{font-size:1.9rem;font-style:italic;margin:8px 0 14px}
.recap ol{list-style:none;counter-reset:s;display:grid;gap:10px}
.recap li{counter-increment:s;display:flex;gap:12px;align-items:baseline}
.recap li::before{content:counter(s,decimal-leading-zero);font-family:'IBM Plex Mono',monospace;color:var(--or-clair);font-size:.8rem}
.recap li span{font-family:'Playfair Display',serif;font-size:1.1rem}
.recap .nav .btn{border-color:var(--or-clair)}
.recap .btn.primary{background:var(--or-clair);color:var(--encre)}
.recap .btn.ghost{color:var(--creme)}

/* Objections */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.pill{padding:8px 14px;border-radius:999px;border:1px solid var(--bord);font-size:.88rem}
.pill[aria-pressed="true"]{background:var(--encre);color:var(--creme);border-color:var(--encre)}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--bord);background:#fff0;font:inherit;margin-bottom:12px}
.obj{border:1px solid var(--bord);background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.obj>button{width:100%;text-align:left;padding:16px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.obj>button span.q{font-family:'Playfair Display',serif;font-size:1.1rem;font-style:italic;font-weight:600}
.obj>button::after{content:"+";color:var(--or);font-size:1.4rem;line-height:1}
.obj.open>button::after{content:"–"}
.obj-a{display:none}
.obj.open .obj-a{display:block;animation:in .3s ease both}
.empty{color:var(--gris);padding:24px 0;text-align:center}

/* Idées */
.panel{border:1px solid var(--bord);background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:22px;margin-top:20px}
.panel h2{font-size:1.6rem;font-style:italic;margin:6px 0 8px}
.panel p.sub{color:var(--gris);font-size:.92rem;margin-bottom:16px}
label{display:block;font-size:.85rem;font-weight:500;margin:12px 0 6px}
select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bord);background:#fff0;font:inherit}
textarea{min-height:110px;resize:vertical}
.msg{margin-top:12px;font-size:.9rem;color:var(--gris)}
.idea{border-top:1px solid var(--bord);padding:14px 0}
.idea:first-of-type{border-top:0}
.idea .m{display:flex;justify-content:space-between;gap:10px;color:var(--gris);font-size:.78rem;margin-bottom:4px}
.idea p{white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{font-size:.78rem;padding:5px 12px;border:1px solid var(--bord);border-radius:999px}
.acts button:hover{border-color:var(--or);color:var(--or)}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--or)}
[hidden]{display:none!important}

/* Ajouts v2 */
.flag{display:inline-block;margin-left:10px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre);background:var(--or-clair);padding:3px 10px;border-radius:999px;vertical-align:middle}
.mention{border-left:2px solid var(--or);padding:4px 0 4px 14px;color:#3a3833;font-size:.92rem;margin:4px 0 18px}
h2.sec{font-size:1.6rem;font-style:italic;margin:28px 0 12px}
.arg{border-top:1px solid var(--bord)}
.arg:first-child{border-top:0}
.arg-h{display:flex;gap:12px;align-items:baseline;padding:18px 18px 0}
.arg-h .num{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--or)}
.arg-h .angle{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;font-style:italic}
.arg .say{margin-top:12px}

/* ===== v3 : esthétique et interaction ===== */
.card{position:relative}
.bignum{position:absolute;right:18px;top:8px;font-family:'Playfair Display',serif;font-size:4.6rem;font-weight:600;line-height:1;color:transparent;-webkit-text-stroke:1px var(--or-clair);opacity:.55;pointer-events:none}
.card-h{padding-right:96px}
.say blockquote{font-size:1.28rem}
.say .s{display:inline;opacity:0;animation:sIn .6s ease forwards;animation-delay:var(--d,0s)}
@keyframes sIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.nav.sticky{position:sticky;bottom:0;background:linear-gradient(to top,var(--creme) 70%,transparent);padding:14px 0 12px;margin-top:8px;z-index:5}
.mockbox{margin:2px 0 12px}
.mockbox:empty{display:none}
.tag{display:block}

/* Arguments en onglets */
.arg{border-top:0}
.arg-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
.arg-tabs::-webkit-scrollbar{display:none}
.arg-tab{flex:0 0 auto;display:flex;gap:8px;align-items:baseline;padding:8px 14px;border:1px solid var(--bord);border-radius:999px;transition:background .2s,border-color .2s,color .2s}
.arg-tab .num{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--or)}
.arg-tab .angle{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;font-style:italic;white-space:nowrap}
.arg-tab[aria-selected="true"]{background:var(--encre);border-color:var(--encre);color:var(--creme)}
.arg-tab[aria-selected="true"] .num{color:var(--or-clair)}
.arg-tab:not([aria-selected="true"]):hover{border-color:var(--or)}
.arg-body{animation:in .3s ease both}

/* ===== v4 : 2026 — captures réelles, visite guidée, transitions ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --sx{syntax:'<length>';inherits:true;initial-value:50%}
@property --sy{syntax:'<length>';inherits:true;initial-value:50%}
@property --sr{syntax:'<length>';inherits:true;initial-value:0px}
:root{
  --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.077 22.4%,1.121 25.6%,1.149 29.3%,1.159 32.2%,1.145 38.8%,1.107 42.5%,1.02 53.2%,.99 60%,.995 68.6%,1 78%,1);
  --glide:cubic-bezier(.65,0,.2,1);
}
.topbar{background:color-mix(in srgb,var(--creme) 74%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.tab{transition:background .3s var(--glide),color .3s,border-color .3s}

/* Vue transitions entre les étapes */
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:var(--glide)}
html[data-dir="fwd"]::view-transition-old(root){animation-name:vtOutL}
html[data-dir="fwd"]::view-transition-new(root){animation-name:vtInR}
html[data-dir="back"]::view-transition-old(root){animation-name:vtOutR}
html[data-dir="back"]::view-transition-new(root){animation-name:vtInL}
@keyframes vtOutL{to{opacity:0;transform:translateX(-5%) scale(.985);filter:blur(4px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(5%) scale(.985);filter:blur(4px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(5%) scale(.985);filter:blur(4px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-5%) scale(.985);filter:blur(4px)}}

/* Accueil */
.hero .kicker,.hero h1,.hero p{animation:rise .8s var(--glide) both}
.hero h1{animation-delay:.08s}.hero p{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.choice{position:relative;overflow:hidden;transition:transform .5s var(--spring),border-color .2s,box-shadow .3s}
.choice::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--or-clair) 30%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.choice:hover::before{opacity:1}
.choice:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(20,23,31,.45)}
.choice>*{position:relative}
.choice:active{transform:scale(.985)}

/* Carte : entrée et bordure animée pour l'Argument clé */
.card{animation:cardIn .6s var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.card.key{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--ang),var(--or-clair),var(--bord) 22%,var(--or-clair) 50%,var(--bord) 72%,var(--or-clair)) border-box;animation:cardIn .6s var(--spring) both,spin 7s linear infinite}
@keyframes spin{to{--ang:360deg}}
.progress i{transition:background .4s,flex .5s var(--spring)}
.progress i.now{flex:2.2}

/* Texte mot à mot */
.w{display:inline-block;opacity:0;animation:wIn .7s var(--glide) forwards;animation-delay:var(--d,0s)}
@keyframes wIn{from{opacity:0;filter:blur(6px);transform:translateY(.35em)}to{opacity:1;filter:none;transform:none}}
.say blockquote{font-size:1.26rem}
.note{padding:14px 22px;color:var(--gris);font-size:.9rem;border-top:1px solid var(--bord)}
.one{display:inline-block;margin:10px 0 12px 10px;font-weight:600;font-size:.9rem}
.show{border-top:1px solid var(--bord)}
.show.wide{padding-left:14px;padding-right:14px}
.chip{transition:background .25s,color .25s,transform .4s var(--spring)}
.chip:active{transform:scale(.94)}
.btn{transition:background .25s,color .25s,transform .4s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.primary{color:var(--encre);background:var(--or-clair);border-color:var(--or-clair)}
.btn.primary:hover{background:var(--encre);color:var(--creme);border-color:var(--encre)}
.recap .btn.primary:hover{background:var(--creme);color:var(--encre);border-color:var(--creme)}

/* Défilement piloté (amélioration progressive) */
@supports (animation-timeline:view()){
  .why,.jr-fin{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
}

/* ---- Captures réelles : visite guidée ---- */
.shot{--rx:0deg;--ry:0deg;border:1px solid var(--bord);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 24px 50px -28px rgba(20,23,31,.55),0 2px 8px rgba(0,0,0,.08);transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--glide);animation:cardIn .6s var(--spring) both}
.shot-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--encre)}
.shot-bar i{width:8px;height:8px;border-radius:50%;background:var(--or-clair);opacity:.75}
.shot-bar i:nth-child(2){opacity:.45}.shot-bar i:nth-child(3){opacity:.25}
.shot-bar span{margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.06em;color:var(--creme);opacity:.8}
.shot-view{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--bord);touch-action:pan-y;user-select:none}
@media(min-width:600px){.shot-view{aspect-ratio:16/10}}
.shot-pan{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;will-change:transform;transition:transform 1.15s var(--glide)}
.shot-pan img{display:block;width:100%;height:auto;pointer-events:none}
.shot-view.nt .shot-pan

.shot-ctrl{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--bord);flex-wrap:wrap}
.shot-ctrl .grow{flex:1}
.shot-dots{display:flex;gap:6px}
.shot-dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--bord);font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gris);transition:background .25s,color .25s,border-color .25s,transform .4s var(--spring)}
.shot-dot[aria-current="true"]{background:var(--encre);color:var(--creme);border-color:var(--encre);transform:scale(1.12)}
.shot-dot:hover{border-color:var(--or)}
.shot-all,.shot-play{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--or);padding:6px 10px;border-radius:999px;border:1px solid transparent}
.shot-all:hover,.shot-play:hover,.shot-all[aria-pressed="true"]{border-color:var(--or)}

/* ---- Parcours de l’acquéreur : sans / avec ---- */
.jr{display:grid;gap:14px;margin-top:6px}
.jr-rail{list-style:none;display:flex;justify-content:space-between;position:relative;padding:4px 6px 0}
.jr-rail::before,.jr-rail::after{content:"";position:absolute;left:22px;right:22px;top:19px;height:3px;border-radius:2px;background:var(--bord)}
.jr-rail::after{right:auto;width:calc((100% - 44px) * (var(--pn,0)));background:var(--or-clair);transition:width .8s var(--glide)}
.jr-rail li{position:relative;z-index:1}
.jr-rail button{width:32px;height:32px;border-radius:50%;background:var(--creme);border:2px solid var(--bord);font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--gris);display:grid;place-items:center;transition:all .5s var(--spring)}
.jr-rail button.done{background:var(--or-clair);border-color:var(--or-clair);color:var(--encre)}
.jr-rail button.now{background:var(--encre);border-color:var(--encre);color:var(--creme);transform:scale(1.22)}
.jr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.jr-tag{display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-bottom:4px}
.jr-moment{font-size:1.45rem;font-style:italic}
.jr-tools{display:flex;gap:8px;align-items:center}
.jr-seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--bord)}
.jr-seg button{padding:7px 13px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--gris);transition:background .35s var(--glide),color .35s}
.jr-seg button[aria-pressed="true"]{background:var(--encre);color:var(--creme)}
.jr-play{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--or);padding:6px 8px}
.jr-panels{display:grid;position:relative}
.jr-pan{grid-area:1/1;border-radius:14px;padding:18px 20px;font-size:1.02rem;line-height:1.5}
.jr-pan .kicker{display:block;margin-bottom:8px}
.jr-pan.sans{border:1.5px dashed var(--bord);background:var(--creme);color:var(--gris)}
.jr-pan.avec{background:var(--encre);color:var(--creme);clip-path:circle(0 at 92% 0);transition:clip-path .8s var(--glide)}
.jr-pan.avec .kicker{color:var(--or-clair)}
.jr[data-ph="avec"] .jr-pan.avec{clip-path:circle(150% at 92% 0)}
.jr-fin{border-left:3px solid var(--or-clair);padding:6px 0 6px 16px;font-family:'Playfair Display',serif;font-style:italic;font-size:1.08rem;line-height:1.45}

.bignum{display:none}

/* Repère : point pulsé + info-bulle vitrée ancrée sur la zone */
.shot-pin{position:absolute;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none;transition:transform 1.15s var(--glide)}
.shot-pin::before{content:"";position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--or-clair);border:2px solid #fff;box-shadow:0 2px 8px rgba(20,23,31,.45)}
.shot-pin::after{content:"";position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:2px solid var(--or-clair);animation:pinPulse 2s ease-out infinite}
@keyframes pinPulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.shot-tip{position:absolute;left:0;top:0;z-index:4;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(320px,52%);padding:8px 14px 8px 8px;border-radius:14px;background:color-mix(in srgb,var(--encre) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--creme);font-size:.86rem;line-height:1.3;box-shadow:0 10px 24px -10px rgba(20,23,31,.6);translate:0 -50%;opacity:0;transition:transform 1.15s var(--glide)}
.shot-tip.l{translate:-100% -50%}
.shot-tip.on{animation:tipIn .6s var(--spring) .7s both}
.shot-tip b{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--or-clair);color:var(--encre);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem}
@keyframes tipIn{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}
.shot-view.all .shot-pin,.shot-view.all .shot-tip{opacity:0}
.shot-view.nt .shot-pin,.shot-view.nt .shot-tip{transition:none}

/* Texte qui se révèle mot à mot (flou → net) */
function mots(texte, base = 0, pas = 0.03){
  const out = [];
  texte.split(' ').forEach((w, i, arr) => {
    out.push(el('span', { class:'w', style:`--d:${Math.min(base + i * pas, 2.6).toFixed(2)}s` }, w));
    if (i < arr.length - 1) out.push(' ');
  });
  return out;
}

const CURSOR_SVG = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 2l15 9-6.5 1.6L9.6 19z" fill="#14171F" stroke="#FAF9F6" stroke-width="1.6" stroke-linejoin="round"/></svg>';

function creerShot(label){
  const m = SHOT_MAP[label]; if (!m) return null;
  const key = m[0], d = SHOTS[key], n = d.c.length;
  let k = m[1] || 0, playing = !REDUCED, visible = true, ready = false;

  const frame = el('div', { class:'shot' });
  const view  = el('div', { class:'shot-view' });
  const pan   = el('div', { class:'shot-pan' });
  const img   = el('img', { src:d.src, alt:'Capture réelle de l’onglet ' + SHOT_TITLE[key] + ' dans Privency', draggable:'false' });
  const pin   = el('div', { class:'shot-pin' });
  const num   = el('b', {}, '1'), txt = el('span', {}, '');
  const cap   = el('div', { class:'shot-tip' }, num, txt);
  pan.append(img); view.append(pan, pin, cap);

  const bar = el('div', { class:'shot-bar' }, el('i'), el('i'), el('i'), el('span', {}, 'Privency · ' + SHOT_TITLE[key]));
  const dots = el('div', { class:'shot-dots', role:'group', 'aria-label':'Points à regarder' });
  const btnAll = el('button', { class:'shot-all', type:'button', 'aria-label':'Voir l’écran entier', onclick:() => { playing = false; maj(); vue(-1); } }, 'Écran entier');
  const btnPlay = el('button', { class:'shot-play', type:'button', onclick:() => { playing = !playing; maj(); } });
  const dotBtns = d.c.map((c, i) => el('button', { class:'shot-dot', type:'button', 'aria-label':`Point ${i+1} : ${c.l}`, onclick:() => { playing = false; maj(); vue(i); } }, String(i + 1)));
  dots.append(...dotBtns);
  const ctrl = el('div', { class:'shot-ctrl' }, dots, el('span', { class:'grow' }), btnAll, ...(REDUCED ? [] : [btnPlay]));
  frame.append(bar, view, ctrl);

  const maj = () => { btnPlay.textContent = playing ? 'Pause' : 'Lecture'; btnPlay.setAttribute('aria-pressed', String(playing)); };
  maj();

  function vue(i){
    k = i;
    const W = view.clientWidth, H = view.clientHeight; if (!W || !H) return;
    const ph = W * d.h / d.w;
    dotBtns.forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
    btnAll.setAttribute('aria-pressed', String(i === -1));
    if (i === -1){
      pan.style.transform = `translate3d(0,${Math.max(0,(H - ph)/2)}px,0) scale(1)`;
      view.classList.add('all');
      cap.classList.remove('on'); return;
    }
    view.classList.remove('all');
    const c = d.c[i];
    const z = Math.max(c.z * (W < 520 ? 1.3 : 1), H / ph, 1);
    const fx = c.x / 100 * W, fy = c.y / 100 * ph;
    let tx = Math.min(0, Math.max(W - W * z, W / 2 - fx * z));
    let ty = ph * z >= H ? Math.min(0, Math.max(H - ph * z, H / 2 - fy * z)) : (H - ph * z) / 2;
    const sx = fx * z + tx, sy = fy * z + ty;
    pan.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${z})`;
    pin.style.transform = `translate3d(${sx}px,${sy}px,0)`;
    num.textContent = String(i + 1); txt.textContent = c.l;
    const gauche = sx + 24 + cap.offsetWidth > W - 8;
    cap.classList.toggle('l', gauche);
    cap.style.transform = `translate3d(${sx + (gauche ? -24 : 24)}px,${Math.min(H - 30, Math.max(30, sy))}px,0)`;
    cap.classList.remove('on'); void cap.offsetWidth;
    cap.classList.add('on');
  }

  // Initialisation dès que la taille est connue : on part de la vue d’ensemble puis on zoome
  const ro = new ResizeObserver(() => {
    if (!view.clientWidth) return;
    if (!ready){
      ready = true; view.classList.add('nt'); const kk = k; vue(-1);
      requestAnimationFrame(() => requestAnimationFrame(() => { view.classList.remove('nt'); setTimeout(() => vue(kk), REDUCED ? 0 : 500); }));
    } else { view.classList.add('nt'); vue(k); requestAnimationFrame(() => view.classList.remove('nt')); }
  });
  ro.observe(view);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(frame);

  const t = setInterval(() => {
    if (!frame.isConnected){ if (ready) clearInterval(t); return; }
    if (playing && visible && ready && n > 1) vue(k < 0 ? 0 : (k + 1) % n);
  }, 4200);

  // Inclinaison douce au pointeur (souris uniquement)
  if (!REDUCED && matchMedia('(hover:hover) and (pointer:fine)').matches){
    frame.addEventListener('pointermove', ev => {
      const r = frame.getBoundingClientRect();
      frame.style.setProperty('--ry', ((ev.clientX - r.left) / r.width - .5) * 3 + 'deg');
      frame.style.setProperty('--rx', (.5 - (ev.clientY - r.top) / r.height) * 2.4 + 'deg');
    });
    frame.addEventListener('pointerleave', () => { frame.style.setProperty('--rx', '0deg'); frame.style.setProperty('--ry', '0deg'); });
  }
  return frame;
}

function creerJourney(intro){
  let i = 0, ph = 'sans', playing = !REDUCED, started = false, timer = null;
  const root = el('div', { class:'jr', 'data-ph':'sans' });
  const rail = el('ol', { class:'jr-rail' }, ...JOURNEY.map((s, n) =>
    el('li', {}, el('button', { type:'button', 'aria-label':`Étape ${n+1} : ${s.moment}`, onclick:() => { stop(); i = n; ph = 'sans'; rendreJ(); } }, el('span', {}, String(n + 1))))));
  const moment = el('h3', { class:'jr-moment' });
  const tag = el('span', { class:'jr-tag' });
  const sansP = el('div', { class:'jr-pan sans' });
  const avecP = el('div', { class:'jr-pan avec' });
  const panels = el('div', { class:'jr-panels' }, sansP, avecP);
  const bSans = el('button', { type:'button', onclick:() => { stop(); ph = 'sans'; rendreJ(); } }, 'Sans Privency');
  const bAvec = el('button', { type:'button', onclick:() => { stop(); ph = 'avec'; rendreJ(); } }, 'Avec Privency');
  const seg = el('div', { class:'jr-seg', role:'group', 'aria-label':'Comparer' }, bSans, bAvec);
  const play = el('button', { class:'jr-play', type:'button', onclick:() => { if (playing) stop(); else { playing = true; majPlay(); planifier(); } } });
  const shotBox = el('div', { class:'jr-shot' });
  const fin = el('div', { class:'jr-fin' }, el('span', { class:'kicker' }, 'Le point commun'), el('p', {}, JOURNEY_FIN));
  const head = el('div', { class:'jr-head' }, el('div', {}, tag, moment), el('div', { class:'jr-tools' }, seg, ...(REDUCED ? [] : [play])));
  root.append(rail, ...(intro ? [intro] : []), head, panels, shotBox, fin);

  const majPlay = () => { play.textContent = playing ? 'Pause' : 'Lecture auto'; };
  const stop = () => { playing = false; clearTimeout(timer); majPlay(); };
  function planifier(){
    clearTimeout(timer);
    if (!playing || !root.isConnected) return;
    const s = JOURNEY[i], txtLen = (ph === 'sans' ? s.sans : s.avec).length;
    timer = setTimeout(() => {
      if (!playing || !root.isConnected) return;
      if (ph === 'sans'){ ph = 'avec'; rendreJ(); planifier(); }
      else if (i < JOURNEY.length - 1){ i++; ph = 'sans'; rendreJ(); planifier(); }
      else { playing = false; majPlay(); }
    }, 2200 + txtLen * 38);
  }
  function rendreJ(){
    const s = JOURNEY[i];
    root.dataset.ph = ph;
    rail.querySelectorAll('button').forEach((b, n) => { b.className = n < i ? 'done' : (n === i ? 'now' : ''); b.setAttribute('aria-current', String(n === i)); });
    rail.style.setProperty('--pn', String(i / (JOURNEY.length - 1)));
    moment.textContent = s.moment; tag.textContent = s.tag;
    sansP.replaceChildren(el('span', { class:'kicker' }, 'Sans Privency'), el('p', {}, ph === 'sans' ? mots(s.sans, 0.05) : s.sans));
    avecP.replaceChildren(el('span', { class:'kicker' }, 'Avec Privency'), el('p', {}, ph === 'avec' ? mots(s.avec, 0.25) : s.avec));
    sansP.setAttribute('aria-hidden', String(ph !== 'sans')); avecP.setAttribute('aria-hidden', String(ph !== 'avec'));
    bSans.setAttribute('aria-pressed', String(ph === 'sans')); bAvec.setAttribute('aria-pressed', String(ph === 'avec'));
    if (shotBox.dataset.k !== String(i)){ shotBox.dataset.k = String(i); const sh = creerShot(s.montre); shotBox.replaceChildren(...(sh ? [sh] : [])); }
  }
  rendreJ(); majPlay();
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting && !started){ started = true; io.disconnect(); if (playing) planifier(); } }, { threshold:.35 });
    io.observe(root);
  } else if (playing) planifier();
  return root;
}

/* ---------- État & utilitaires ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const state = { tab:'rdv', cible:null, i:0, filtre:'tous', q:'', user:null, isAdmin:false, hintOff:false };
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};
const HINT_KEY = 'privency_hint_' + (CFG.tabs.idees ? 'bao' : 'agents');

const UNIQUE = false;

function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) n.append(c instanceof Node ? c : document.createTextNode(c));
  return n;
}
async function copier(texte, btn){
  try{ await navigator.clipboard.writeText(texte); btn.textContent = 'Copié'; }
  catch{ btn.textContent = 'Sélectionne le texte'; }
  setTimeout(()=>{ btn.textContent = 'Copier la phrase'; }, 1600);
}

/* Bloc réutilisable : phrase à dire + à montrer (captures réelles animées) + pourquoi */
function blocArgument(a){
  const say = el('div',{class:'say on-dark'},
    el('span',{class:'kicker'},'À dire'),
    el('blockquote',{}, ...mots(a.dire, 0.1, 0.028)),
    el('button',{class:'copy',onclick:e=>copier(a.dire,e.currentTarget)},'Copier la phrase'));
  const why = el('details',{class:'why'}, el('summary',{},'Pourquoi ça marche'), el('p',{}, a.pourquoi));
  const tag = el('span',{class:'tag'}, a.tag);

  if (a.journey) return [el('div',{class:'show wide'}, creerJourney(say), tag), why];
  if (!a.montre.length) return [say, ...(a.note ? [el('p',{class:'note'}, a.note)] : []), why];

  const box = el('div',{class:'mockbox'});
  const chips = el('div',{class:'chips'});
  const montrer = k => {
    chips.querySelectorAll('.chip').forEach((c,i)=>c.setAttribute('aria-pressed', String(i===k)));
    const s = creerShot(a.montre[k]);
    box.replaceChildren(...(s ? [s] : []));
  };
  if (a.montre.length > 1) a.montre.forEach((m,k)=>chips.append(el('button',{class:'chip','aria-pressed':'false',type:'button',onclick:()=>montrer(k)}, m)));
  montrer(0);
  const show = el('div',{class:'show'}, el('span',{class:'kicker lab'},'À montrer'),
    ...(a.montre.length > 1 ? [chips] : [el('span',{class:'one'}, a.montre[0])]), box, tag);
  return [say, show, why];
}

/* ---------- Écrans ---------- */
function ecranAccueil(){
  const frag = document.createDocumentFragment();
  const H = CFG.accueil;
  frag.append(
    el('section',{class:'hero'},
      el('span',{class:'kicker'}, H.kicker),
      el('h1',{}, H.h1a, el('em',{}, H.h1b)),
      el('p',{}, H.p)),
    el('div',{class:'choices'}, ...CFG.choix.map(c=>{
      const n = PARCOURS[c.cle].etapes.length;
      return el('button',{class:'choice'+(c.dark?' dark':''),onclick:()=>lancer(c.cle)},
        el('span',{class:'kicker'}, c.kicker), el('h3',{}, c.titre),
        el('small',{}, c.small), el('span',{class:'go'}, `${n} étapes · 2 min →`));
    })));
  frag.querySelectorAll('.choice').forEach(c => c.addEventListener('pointermove', ev => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (ev.clientX - r.left) + 'px'); c.style.setProperty('--my', (ev.clientY - r.top) + 'px'); }));
  if (!state.hintOff){
    frag.append(el('div',{class:'hint'}, el('span',{}, CFG.hint),
      el('button',{onclick:()=>{ state.hintOff = true; store.set(HINT_KEY,'1'); rendre(); }},'Compris')));
  }
  return frag;
}
function vt(fn, dir){
  if (document.startViewTransition && !REDUCED){ document.documentElement.dataset.dir = dir || 'fwd'; document.startViewTransition(fn); }
  else fn();
}
const aller = (fn, dir) => vt(() => { fn(); rendre(); window.scrollTo({top:0}); }, dir);
function lancer(c){ aller(() => { state.cible = c; state.i = 0; }); }
function quitter(){ aller(() => { if (UNIQUE){ state.i = 0; } else { state.cible = null; } }, 'back'); }

function ecranParcours(){
  const p = PARCOURS[state.cible];
  const n = p.etapes.length;
  const frag = document.createDocumentFragment();
  const retour = UNIQUE ? el('span',{}) : el('button',{class:'back',onclick:quitter},'← Changer de rendez-vous');

  if (state.i >= n){
    frag.append(
      el('div',{class:'meta'}, retour),
      el('div',{class:'recap on-dark'},
        el('span',{class:'kicker'},'Ta fiche de RDV'),
        el('h2',{},'Tu as les bons arguments.'),
        el('ol',{}, ...p.etapes.map(e=>el('li',{}, el('span',{}, e.titre)))),
        el('div',{class:'nav'},
          el('button',{class:'btn ghost',onclick:()=>aller(()=>{state.i=0;},'back')},'Rejouer'),
          el('button',{class:'btn primary',onclick:quitter},'Terminer'))));
    return frag;
  }
  const e = p.etapes[state.i];
  frag.append(
    el('div',{class:'meta'}, retour, el('span',{class:'kicker',style:'white-space:nowrap'}, `${state.i+1} / ${n}`)),
    el('div',{class:'progress'}, ...p.etapes.map((_,k)=>el('i',{class: k<state.i?'done':(k===state.i?'now':'')}))),
    el('article',{class:'card'+(e.cle?' key':'')},
      el('div',{class:'card-h'},
        el('span',{class:'bignum','aria-hidden':'true'}, String(state.i+1).padStart(2,'0')),
        el('span',{class:'kicker'}, `Étape ${String(state.i+1).padStart(2,'0')} · ${e.moment}`),
        e.cle ? el('span',{class:'flag'},'Argument clé') : '',
        el('h2',{}, e.titre)),
      ...blocArgument(e)),
    el('div',{class:'nav sticky'},
      el('button',{class:'btn ghost',disabled:state.i===0,onclick:()=>aller(()=>{state.i--;},'back')},'Précédent'),
      el('button',{class:'btn primary',onclick:()=>aller(()=>{state.i++;})}, state.i===n-1?'Voir ma fiche':'Suivant')));
  return frag;
}


function argTabs(o){
  let k = 0;
  const wrap = el('div',{class:'arg'});
  const tabs = el('div',{class:'arg-tabs',role:'tablist','aria-label':'Trois façons de répondre'});
  const body = el('div',{class:'arg-body'});
  const draw = () => {
    tabs.replaceChildren(...o.args.map((a,i)=>el('button',{class:'arg-tab',role:'tab','aria-selected':String(i===k),onclick:()=>{k=i;draw();}},
      el('span',{class:'num'}, String(i+1)), el('span',{class:'angle'}, a.angle))));
    body.replaceChildren(...blocArgument(o.args[k]));
    const sel = tabs.querySelector('[aria-selected="true"]');
    if (sel) tabs.scrollLeft = Math.max(0, sel.offsetLeft - 18);
  };
  draw();
  wrap.append(tabs, body);
  return wrap;
}

function ecranObjections(){
  const frag = document.createDocumentFragment();
  const H = CFG.objHero;
  const search = el('input',{class:'search',type:'search',placeholder:'Cherche un mot : prix, exclusivité, réfléchir…','aria-label':'Rechercher une objection',value:state.q});
  search.addEventListener('input',()=>{ state.q = search.value; const pos = search.selectionStart; rendre(); const s=$('.search'); s.focus(); s.setSelectionRange(pos,pos); });

  frag.append(
    el('section',{class:'hero'},
      el('span',{class:'kicker'}, H.kicker),
      el('h1',{}, H.h1a, el('em',{}, H.h1b)),
      el('p',{}, H.p)),
    el('div',{class:'mention'}, CFG.objMention),
    search);

  if (CFG.objSections.length > 1){
    frag.append(el('div',{class:'filters'}, ...[{cle:'tous',titre:'Tous'}, ...CFG.objSections.map(s=>({cle:s.cle,titre:s.cle==='vendeur'?'Vendeur':'Acquéreur'}))].map(f=>
      el('button',{class:'pill','aria-pressed':String(state.filtre===f.cle),onclick:()=>{state.filtre=f.cle;rendre();}}, f.titre))));
  }
  const q = state.q.toLowerCase();
  let total = 0;
  CFG.objSections.forEach(sec=>{
    if (state.filtre!=='tous' && state.filtre!==sec.cle) return;
    const liste = OBJECTIONS.filter(o=>o.cible===sec.cle &&
      (!q || (o.q + o.args.map(a=>a.dire+a.angle).join(' ')).toLowerCase().includes(q)));
    if (!liste.length) return;
    total += liste.length;
    frag.append(el('h2',{class:'sec'}, sec.titre));
    liste.forEach(o=>{
      const item = el('div',{class:'obj'},
        el('button',{'aria-expanded':'false',onclick:()=>{ const open = item.classList.toggle('open'); item.firstChild.setAttribute('aria-expanded',String(open)); }},
          el('span',{class:'q'}, o.q)),
        el('div',{class:'obj-a'}, argTabs(o)));
      frag.append(item);
    });
  });
  if (!total) frag.append(el('p',{class:'empty'}, CFG.tabs.idees ? 'Aucune objection ne correspond. Ajoute-la dans « Mes idées » pour qu’on la traite.' : 'Aucune objection ne correspond.'));
  return frag;
}

function ecranIdees(){
  const frag = document.createDocumentFragment();
  const form = el('form',{},
    el('label',{for:'ctx'},'Situation'),
    el('select',{id:'ctx'},
      el('option',{value:'vendeur'},'Rendez-vous vendeur'),
      el('option',{value:'acquereur'},'Visite acquéreur'),
      el('option',{value:'autre'},'Autre')),
    el('label',{for:'idee'},'Ton argument, ta phrase ou ton astuce'),
    el('textarea',{id:'idee',required:true,maxlength:'2000',placeholder:'Ce qui a bien marché pour toi, avec les mots que tu as utilisés.'}),
    el('div',{class:'nav'}, el('button',{class:'btn primary',type:'submit'},'Envoyer mon idée')),
    el('p',{class:'msg',id:'msg'},''));
  form.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const msg = $('#msg');
    if (!sb || !state.user){ msg.textContent = 'Connecte-toi à Privency pour envoyer une idée.'; return; }
    const idee = $('#idee').value.trim();
    if (idee.length < 3){ msg.textContent = 'Écris au moins quelques mots.'; return; }
    const { error } = await sb.from('argumentaire_idees').insert({ contexte:$('#ctx').value, idee });
    if (error){ msg.textContent = 'Impossible d’envoyer pour l’instant. Réessaie dans un instant.'; return; }
    $('#idee').value = ''; msg.textContent = 'Merci, ton idée est bien enregistrée.';
    chargerMesIdees();
  });
  frag.append(
    el('section',{class:'hero'},
      el('span',{class:'kicker'},'Mes idées'),
      el('h1',{},'Ce qui marche ', el('em',{},'chez toi.')),
      el('p',{}, CFG.ideesHero.p)),
    el('div',{class:'panel'}, el('span',{class:'kicker'},'Nouvelle idée'), form),
    el('div',{class:'panel'}, el('span',{class:'kicker'},'Mes idées envoyées'), el('div',{id:'mes-idees'}, el('p',{class:'msg'},'Chargement…'))));
  setTimeout(chargerMesIdees,0);
  return frag;
}
const LIB_CTX = { vendeur:'Vendeur', acquereur:'Acquéreur', autre:'Autre' };
const LIB_ST = { nouvelle:'Nouvelle', retenue:'Retenue', ecartee:'Écartée' };
const fmt = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});

async function chargerMesIdees(){
  const box = $('#mes-idees'); if (!box) return;
  if (!sb || !state.user){ box.replaceChildren(el('p',{class:'msg'},'Connecte-toi à Privency pour voir tes idées.')); return; }
  const { data, error } = await sb.from('argumentaire_idees').select('*').eq('agent_user_id', state.user.id).order('created_at',{ascending:false});
  if (error){ box.replaceChildren(el('p',{class:'msg'},'Chargement impossible pour l’instant.')); return; }
  if (!data.length){ box.replaceChildren(el('p',{class:'msg'},'Aucune idée envoyée pour l’instant.')); return; }
  box.replaceChildren(...data.map(i=>el('div',{class:'idea'},
    el('div',{class:'m'}, el('span',{}, `${LIB_CTX[i.contexte]||'Autre'} · ${fmt(i.created_at)}`), el('span',{class:'badge'}, LIB_ST[i.statut])),
    el('p',{}, i.idee))));
}
function ecranAdmin(){
  const frag = document.createDocumentFragment();
  frag.append(
    el('section',{class:'hero'},
      el('span',{class:'kicker'},'Réservé à Olivier'),
      el('h1',{},'Idées des ', el('em',{},'agents.')),
      el('p',{},'Seuls tes comptes voient cette liste. Marque « Retenue » ce qui mérite d’entrer dans la boîte à outils.')),
    el('div',{class:'panel'}, el('div',{id:'admin-list'}, el('p',{class:'msg'},'Chargement…'))));
  setTimeout(chargerAdmin,0);
  return frag;
}
async function chargerAdmin(){
  const box = $('#admin-list'); if (!box || !sb) return;
  const { data, error } = await sb.from('argumentaire_idees').select('*').order('created_at',{ascending:false});
  if (error){ box.replaceChildren(el('p',{class:'msg'},'Chargement impossible.')); return; }
  if (!data.length){ box.replaceChildren(el('p',{class:'msg'},'Aucune idée reçue pour l’instant.')); return; }
  const ids = [...new Set(data.map(d=>d.agent_user_id))];
  const noms = {};
  try{
    const r = await sb.from('agent_profiles').select('user_id,prenom,nom').in('user_id',ids);
    (r.data||[]).forEach(p=>{ noms[p.user_id] = [p.prenom,p.nom].filter(Boolean).join(' '); });
  }catch{}
  const maj = async (id, statut) => { await sb.from('argumentaire_idees').update({statut}).eq('id',id); chargerAdmin(); };
  const sup = async id => { await sb.from('argumentaire_idees').delete().eq('id',id); chargerAdmin(); };
  box.replaceChildren(...data.map(i=>el('div',{class:'idea'},
    el('div',{class:'m'}, el('span',{}, `${noms[i.agent_user_id]||('Agent '+i.agent_user_id.slice(0,6))} · ${LIB_CTX[i.contexte]||'Autre'} · ${fmt(i.created_at)}`), el('span',{class:'badge'}, LIB_ST[i.statut])),
    el('p',{}, i.idee),
    el('div',{class:'acts'},
      el('button',{onclick:()=>maj(i.id,'retenue')},'Retenir'),
      el('button',{onclick:()=>maj(i.id,'ecartee')},'Écarter'),
      el('button',{onclick:()=>sup(i.id)},'Supprimer')))));
}

/* ---------- Rendu & navigation ---------- */
function construireOnglets(){
  const nav = $('#tabs');
  const defs = [['rdv',CFG.tabs.rdv],['obj',CFG.tabs.obj]];
  if (CFG.tabs.idees) defs.push(['idees','Mes idées'],['admin','Idées des agents']);
  nav.replaceChildren(...defs.map(([id,l])=>{
    const b = el('button',{class:'tab',role:'tab',id:'t-'+id,'data-tab':id,'aria-selected':'false'}, l);
    if (id==='admin') b.hidden = true;
    b.addEventListener('click',()=>{ aller(()=>{ state.tab=id; }); });
    return b;
  }));
}
function rendre(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.tab===state.tab)));
  const adm = $('#t-admin'); if (adm) adm.hidden = !state.isAdmin;
  let vue;
  if (state.tab==='rdv') vue = state.cible ? ecranParcours() : ecranAccueil();
  else if (state.tab==='obj') vue = ecranObjections();
  else if (state.tab==='idees') vue = ecranIdees();
  else vue = state.isAdmin ? ecranAdmin() : ecranAccueil();
  app.replaceChildren(vue);
}
construireOnglets();
rendre();
if (sb){
  try{
    const { data } = await sb.auth.getSession();
    state.user = data?.session?.user || null;
    state.isAdmin = !!state.user && ADMIN_IDS.includes(state.user.id);
  }catch{}
  rendre();
}

/* Navigation clavier et balayage tactile entre les étapes */
function pas(d){
  if (state.tab!=='rdv' || !state.cible) return;
  const n = PARCOURS[state.cible].etapes.length;
  const j = state.i + d;
  if (j<0 || j>n) return;
  aller(() => { state.i = j; }, d < 0 ? 'back' : 'fwd');
}
document.addEventListener('keydown', ev=>{
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if (ev.key==='ArrowRight') pas(1); else if (ev.key==='ArrowLeft') pas(-1);
});
let tx=0, ty=0;
app.addEventListener('touchstart', ev=>{ tx=ev.touches[0].clientX; ty=ev.touches[0].clientY; }, {passive:true});
app.addEventListener('touchend', ev=>{
  if (ev.target.closest('.shot, .jr, .arg-tabs, input')) return;
  const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty;
  if (Math.abs(dx)>70 && Math.abs(dy)<40) pas(dx<0 ? 1 : -1);
}, {passive:true});
