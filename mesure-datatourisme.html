<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style id="auth-guard-hide">body { display: none !important; }</style>
<title>Mesure DATAtourisme (temporaire)</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0F1A16;background:#F7F8FA;margin:0;padding:16px;}
  h1{font-size:20px;margin:0 0 4px;} h2{font-size:16px;margin:24px 0 8px;}
  .sub{color:#667085;margin:0 0 16px;}
  .box{background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto;}
  table{border-collapse:collapse;width:100%;min-width:760px;} th,td{border:1px solid #E4E7EC;padding:8px;vertical-align:top;text-align:left;font-size:13px;}
  th{background:#F2F4F7;} td b{font-size:16px;} td ul{margin:4px 0 0;padding-left:16px;color:#475467;}
  .err{color:#A33;font-weight:600;} .muted{color:#667085;font-size:12px;} code{font-size:12px;word-break:break-all;}
</style>
</head>
<body>
<h1>Mesure DATAtourisme — Longjumeau, Chilly-Mazarin, Wissous</h1>
<p class="sub">Page temporaire, réservée au compte administrateur. Lecture seule : l'API DATAtourisme est interrogée à chaque ouverture, rien n'est enregistré.</p>
<div id="statut" class="box">⏳ Interrogation de l'API DATAtourisme (quelques secondes)…</div>
<div id="resultat"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
(function () {
  var ADMIN_USER_ID = '79e4e432-2232-4d2c-b41d-8c7c907c4dec';
  var authClient = PrivencyAuth.getClient(), resolved = false;
  function reveal() { var h = document.getElementById('auth-guard-hide'); if (h) h.remove(); document.body.style.display = 'block'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function denied() { if (resolved) return; resolved = true; window.location.replace('/login.html?next=/mesure-datatourisme.html'); }
  function decide(session) {
    if (resolved) return; resolved = true; reveal();
    if (!session.user || session.user.id !== ADMIN_USER_ID) { document.getElementById('statut').innerHTML = '<span class="err">⛔ Page réservée au compte administrateur (vous êtes connecté avec ' + esc(session.user && session.user.email) + ').</span>'; return; }
    charger(session);
  }
  authClient.auth.onAuthStateChange(function (e, s) { if (s) decide(s); else denied(); });
  authClient.auth.getSession().then(function (r) { var s = r.data && r.data.session; if (s) decide(s); else denied(); }).catch(denied);
  setTimeout(denied, 3000);

  async function charger(session) {
    var st = document.getElementById('statut');
    try {
      var r = await fetch('/api/mesure-datatourisme', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) { st.innerHTML = '<span class="err">❌ ' + esc(d.error || ('Erreur HTTP ' + r.status)) + '</span>'; return; }
      st.innerHTML = 'Source : ' + esc(d.source) + ' · interrogée le ' + esc(d.date) + ' · ' + esc(d.page_size) + ' objets par page, ' + esc(d.pages_max) + ' pages au plus par commune.';
      afficher(d);
    } catch (e) { st.innerHTML = '<span class="err">❌ ' + esc(e.message) + '</span>'; }
  }
  function afficher(d) {
    var cols = d.categories, h = '<div class="box"><table><tr><th>Commune</th>' + cols.map(function (c) { return '<th>' + esc(c.libelle) + '</th>'; }).join('') + '</tr>';
    d.communes.forEach(function (c) {
      h += '<tr><th>' + esc(c.commune) + '<div class="muted">INSEE ' + esc(c.insee) + '</div></th>';
      if (!c.cases) { h += '<td colspan="' + cols.length + '" class="err">' + esc(c.erreur || 'Pas de résultat') + '</td></tr>'; return; }
      cols.forEach(function (k) { var x = c.cases[k.cle] || { nombre: 0, exemples: [] };
        h += '<td><b>' + esc(x.nombre) + '</b>' + (x.sans_date ? '<div class="muted">+ ' + esc(x.sans_date) + ' événement(s) sans date</div>' : '') + (x.exemples.length ? '<ul>' + x.exemples.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') + '</td>'; });
      h += '</tr>';
    });
    h += '</table></div><h2>Contrôles et réponses brutes de l\'API</h2>';
    d.communes.forEach(function (c) {
      h += '<div class="box"><b>' + esc(c.commune) + '</b> — filtre retenu : ' + esc(c.filtre_retenu || 'aucun') +
        (c.total_annonce != null ? ' · total annoncé par l\'API : <b>' + esc(c.total_annonce) + '</b> · objets lus : ' + esc(c.objets_lus) + (c.tronque ? ' <span class="err">(tronqué)</span>' : '') + ' · sans le code INSEE dans l\'objet : ' + esc(c.objets_sans_code_insee) + ' · sans type : ' + esc(c.objets_sans_type) : '') +
        (c.erreur ? '<div class="err">' + esc(c.erreur) + '</div>' : '') + (c.erreur_pagination ? '<div class="err">Pagination interrompue : ' + esc(JSON.stringify(c.erreur_pagination)) + '</div>' : '') +
        '<div class="muted" style="margin-top:6px;">Essais :</div><ul>' + c.essais.map(function (e) { return '<li><code>' + esc(e.requete) + '</code> → statut ' + esc(e.statut) + ', total ' + esc(e.total) + ', page 1 : ' + esc(e.objets_page1) + ' objet(s) dont ' + esc(e.objets_page1_dans_commune) + ' dans la commune' + (e.cles_reponse ? '<br><span class="muted">clés de la réponse : ' + esc(e.cles_reponse.join(', ')) + '</span>' : '') + (e.cles_premier_objet ? '<br><span class="muted">clés du 1er objet : ' + esc(e.cles_premier_objet.join(', ')) + '</span>' : '') + (e.extrait_si_non_json ? '<br><span class="err">réponse non JSON : ' + esc(e.extrait_si_non_json) + '</span>' : '') + '</li>'; }).join('') + '</ul>' +
        (c.repartition_types && c.repartition_types.length ? '<div class="muted">Types renvoyés (nombre d\'objets) : ' + esc(c.repartition_types.map(function (t) { return t[0] + ' ' + t[1]; }).join(' · ')) + '</div>' : '') + '</div>';
    });
    document.getElementById('resultat').innerHTML = h;
  }
})();
</script>
</body>
</html>
