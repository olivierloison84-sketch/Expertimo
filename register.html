<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Privency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css">
<style>
  body{
    background:var(--gray-50);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .auth-wrap{
    width:100%;
    max-width:440px;
  }

  .auth-brand{
    text-align:center;
    margin-bottom:var(--s-6);
  }

  .auth-brand .logo{
    font-weight:800;
    font-size:1.5rem;
    letter-spacing:-.02em;
    color:var(--ink);
  }

  .auth-brand .logo b{
    color:var(--brand-500);
    font-weight:800;
  }

  .auth-brand p{
    margin:8px 0 0;
    font-size:var(--text-sm);
    color:var(--muted);
  }

  .card-title{
    text-align:center;
    margin-bottom:var(--s-6);
  }

  .field-row{
    display:flex;
    gap:14px;
  }

  .field-row .field-group{
    flex:1;
  }

  .field-group{
    margin-bottom:var(--s-5);
  }

  .alert-success.confirm-sent{
    text-align:center;
    padding:var(--s-6) var(--s-5);
    font-size:var(--text-base);
    line-height:1.6;
  }

  .auth-switch{
    margin-top:var(--s-6);
    text-align:center;
    font-size:var(--text-sm);
    color:var(--muted);
  }

  .auth-switch a{
    font-weight:600;
  }

  .auth-switch a:hover{
    text-decoration:underline;
  }
</style>
<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "yfjfjzv3a2");</script></head>
<body>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="logo">Priven<b>cy</b></div>
    <p>Votre espace immobilier professionnel</p>
  </div>

  <div class="card">
    <h2 class="h3 card-title">Créer un compte</h2>
    <form id="register-form" novalidate>
      <div class="field-row">
        <div class="field-group">
          <label class="label" for="prenom">Prénom</label>
          <input class="field" type="text" id="prenom" name="prenom" placeholder="Jean" autocomplete="given-name" required>
        </div>
        <div class="field-group">
          <label class="label" for="nom">Nom</label>
          <input class="field" type="text" id="nom" name="nom" placeholder="Dupont" autocomplete="family-name" required>
        </div>
      </div>
      <div class="field-group">
        <label class="label" for="email">Adresse email</label>
        <input class="field" type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email" required>
      </div>
      <div class="field-group">
        <label class="label" for="password">Mot de passe</label>
        <input class="field" type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Créer mon compte</button>
      <div class="alert alert-error" id="error-message"></div>
    </form>
    <div class="alert alert-success" id="success-message"></div>
    <p class="auth-switch">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
  // Client jetable : l'inscription ne doit jamais écraser la session d'un
  // autre compte déjà ouvert dans ce navigateur.
  const client = PrivencyAuth.createTempClient();

  const form = document.getElementById('register-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorMessage = document.getElementById('error-message');
  const successMessage = document.getElementById('success-message');

  function translateError(message) {
    const translations = {
      'User already registered': 'Un compte existe déjà avec cette adresse email.',
      'Password should be at least 6 characters.': 'Le mot de passe doit contenir au moins 6 caractères.',
      'Unable to validate email address: invalid format': 'L\'adresse email est invalide.',
      'Signup requires a valid password': 'Veuillez saisir un mot de passe valide.'
    };
    return translations[message] || message;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const prenom = document.getElementById('prenom').value.trim();
    const nom = document.getElementById('nom').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errorMessage.classList.remove('visible');
    errorMessage.textContent = '';
    successMessage.classList.remove('visible');
    successMessage.textContent = '';

    if (!prenom || !nom || !email || !password) {
      errorMessage.textContent = 'Veuillez remplir tous les champs.';
      errorMessage.classList.add('visible');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Création…';

    const { error } = await client.auth.signUp({
      email,
      password,
      options: {
        data: { prenom, nom },
        emailRedirectTo: window.location.origin + '/dashboard.html'
      }
    });

    if (error) {
      errorMessage.textContent = translateError(error.message);
      errorMessage.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Créer mon compte';
      return;
    }

    form.style.display = 'none';
    document.querySelector('.auth-switch').style.display = 'none';
    successMessage.textContent = '✅ Un email de confirmation a été envoyé à ' + email + '. Cliquez sur le lien qu\'il contient pour activer votre compte.';
    successMessage.classList.add('visible', 'confirm-sent');
  });
</script>

</body>
</html>
