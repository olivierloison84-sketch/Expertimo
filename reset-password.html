<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Privency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css">
<style>
  body{
    background:var(--gray-50);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .auth-wrap{
    width:100%;
    max-width:440px;
  }

  .auth-brand{
    text-align:center;
    margin-bottom:var(--s-6);
  }

  .auth-brand .logo{
    font-weight:800;
    font-size:1.5rem;
    letter-spacing:-.02em;
    color:var(--ink);
  }

  .auth-brand .logo b{
    color:var(--brand-500);
    font-weight:800;
  }

  .auth-brand p{
    margin:8px 0 0;
    font-size:var(--text-sm);
    color:var(--muted);
  }

  .card-title{
    text-align:center;
    margin-bottom:var(--s-2);
  }

  .subtitle{
    text-align:center;
    font-size:var(--text-sm);
    color:var(--muted);
    margin:0 0 var(--s-6);
    line-height:1.5;
  }

  .field-group{
    margin-bottom:var(--s-5);
  }

  .auth-switch{
    margin-top:var(--s-6);
    text-align:center;
    font-size:var(--text-sm);
    color:var(--muted);
  }

  .auth-switch a{
    font-weight:600;
  }

  .auth-switch a:hover{
    text-decoration:underline;
  }
</style>
<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "yfjfjzv3a2");</script></head>
<body>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="logo">Priven<b>cy</b></div>
    <p>Votre espace immobilier professionnel</p>
  </div>

  <div class="card" id="reset-box">
    <h2 class="h3 card-title">Nouveau mot de passe</h2>
    <p class="subtitle" id="subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>
    <form id="reset-form" novalidate>
      <div class="field-group">
        <label class="label" for="password">Nouveau mot de passe</label>
        <input class="field" type="password" id="password" name="password" placeholder="8 caractères minimum" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field-group">
        <label class="label" for="password-confirm">Confirmer le mot de passe</label>
        <input class="field" type="password" id="password-confirm" name="password-confirm" placeholder="••••••••" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Enregistrer le nouveau mot de passe</button>
      <div class="alert alert-error" id="error-message"></div>
      <div class="alert alert-success" id="success-message"></div>
    </form>
    <p class="auth-switch"><a href="/login.html">Retour à la connexion</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
  // Client jetable qui lit le jeton de récupération dans l'URL : la session de
  // récupération reste en mémoire et n'écrase la session d'aucun compte ouvert.
  const client = PrivencyAuth.createTempClient({ detectSessionInUrl: true });

  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorMessage = document.getElementById('error-message');
  const successMessage = document.getElementById('success-message');
  const subtitle = document.getElementById('subtitle');

  let recoveryReady = false;

  // Le lien reçu par email contient un jeton de récupération que le SDK Supabase
  // échange automatiquement contre une session temporaire à l'ouverture de la page.
  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
    }
  });

  // Filet de sécurité : si l'événement PASSWORD_RECOVERY n'a pas encore été capté
  // au moment où l'utilisateur soumet le formulaire, on vérifie la session directement.
  async function ensureRecoverySession() {
    if (recoveryReady) return true;
    const { data } = await client.auth.getSession();
    return !!data.session;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password-confirm').value;

    errorMessage.classList.remove('visible');
    successMessage.classList.remove('visible');

    if (password.length < 8) {
      errorMessage.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
      errorMessage.classList.add('visible');
      return;
    }

    if (password !== passwordConfirm) {
      errorMessage.textContent = 'Les deux mots de passe ne correspondent pas.';
      errorMessage.classList.add('visible');
      return;
    }

    const hasSession = await ensureRecoverySession();
    if (!hasSession) {
      errorMessage.textContent = "Ce lien de réinitialisation n'est plus valide ou a expiré. Redemandez un email depuis la page de connexion.";
      errorMessage.classList.add('visible');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      errorMessage.textContent = error.message;
      errorMessage.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer le nouveau mot de passe';
      return;
    }

    submitBtn.textContent = 'Mot de passe mis à jour ✓';
    document.getElementById('password').disabled = true;
    document.getElementById('password-confirm').disabled = true;
    subtitle.textContent = '';
    successMessage.textContent = 'Mot de passe mis à jour avec succès. Redirection vers la connexion…';
    successMessage.classList.add('visible');

    await client.auth.signOut();
    setTimeout(() => { window.location.href = '/login.html'; }, 2200);
  });
</script>

</body>
</html>
