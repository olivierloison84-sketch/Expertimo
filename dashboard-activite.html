<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style id="auth-guard-hide">body { display: none !important; }</style>
<title>Privency Dashboard · Activité</title>
<meta name="theme-color" content="#0E9F6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css">
<style>
  body{background:var(--gray-50)}

  header{
    background:var(--white);
    border-bottom:1px solid var(--gray-200);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
  }

  .header-brand{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .logo-circle{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--brand-50);
    color:var(--brand-700);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:16px;
    flex-shrink:0;
  }

  .header-brand h1{
    font-size:var(--text-lg);
    font-weight:700;
    color:var(--ink);
    margin:0;
  }

  .header-brand p{
    font-size:var(--text-xs);
    color:var(--muted);
    margin-top:1px;
  }

  .container{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  #dash-status{
    text-align:center;
    color:var(--muted);
    font-size:var(--text-sm);
    padding:60px 20px;
  }

  .forbidden-msg{
    max-width:480px;
    margin:80px auto;
    text-align:center;
    background:var(--red-50);
    border:1px solid rgba(240,68,56,.3);
    border-radius:var(--r-lg);
    padding:32px 24px;
    color:#b42318;
    font-weight:600;
  }

  #kpi-grid{margin-bottom:var(--s-4)}
  .kpi-tile.clic{cursor:pointer;transition:.15s}
  .kpi-tile.clic:hover,.kpi-tile.clic.on{border-color:var(--brand-500);box-shadow:0 6px 18px rgba(14,159,110,.12)}
  .kpi-tile.alerte{background:var(--amber-50)}
  .kpi-sub{font-size:var(--text-xs);color:var(--brand-700);font-weight:600;margin-top:8px}
  .kpi-sub.warn{color:#b54708}
  .kpi-more{font-size:11px;color:var(--muted);margin-top:6px}
  .sec-title{font-size:var(--text-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 12px}
  .sec-title span{text-transform:none;letter-spacing:0;font-weight:500;margin-left:8px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
  .two-col .panel{margin-bottom:0}
  .msg{padding:12px 16px;border-bottom:1px solid var(--gray-200);font-size:var(--text-sm);color:var(--gray-700)}
  .msg:last-child{border-bottom:none}
  .msg b{color:var(--ink)}.msg i{font-style:normal;color:var(--muted);font-size:var(--text-xs)}
  .msg p{margin:4px 0 0;white-space:pre-wrap}
  .container{max-width:1100px}
  .rep-form{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
  .rep-form textarea{flex:1;border:1px solid var(--gray-300);border-radius:var(--r-md,8px);padding:8px;font:inherit;resize:vertical}
  .rep-form .btn{padding:8px 14px;white-space:nowrap}
  .rep-ok{margin-top:8px;padding:8px 10px;background:var(--brand-50);border-radius:8px;color:var(--brand-700);font-size:var(--text-xs);font-weight:600}
  .rep-ok p{font-weight:400;color:var(--gray-700);font-size:var(--text-sm)}

  @media(max-width: 700px){
    #kpi-grid{grid-template-columns:repeat(2, 1fr)}
    .two-col{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
  <div class="header-brand">
    <div class="logo-circle">P</div>
    <div>
      <h1>Tableau de bord</h1>
      <p>Vue d'ensemble des comptes agents Privency</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="switch-account-btn" class="btn btn-ghost" onclick="PrivencyAuth.switchAccount();">Changer de compte</button>
    <button id="logout-btn" class="btn btn-ghost" onclick="PrivencyAuth.signOutActive().then(function(){ window.location.replace('/login.html'); });">Déconnexion</button>
  </div>
</header>

<div class="container" id="dash-root">
  <div id="dash-status">⏳ Chargement des statistiques…</div>

  <div id="dash-content" style="display:none;">

    <div class="sec-title">En un coup d'œil <span>Cliquez sur une carte pour voir le détail</span></div>
    <div class="kpi-grid" id="kpi-grid"></div>
    <div id="kpi-detail"></div>

    <div class="sec-title">Messages des agents</div>
    <div class="two-col">
      <div class="panel"><div class="panel-header">❓ Questions des agents</div><div class="panel-body" id="msg-questions"></div></div>
      <div class="panel"><div class="panel-header">💡 Idées, problèmes et remarques</div><div class="panel-body" id="msg-idees"></div></div>
    </div>

    <div class="sec-title">Activité des agents</div>
    <div class="panel">
      <div class="panel-header">👥 Clients</div>
      <div class="panel-body"><div class="table-wrap" id="clients-table-wrap"></div></div>
    </div>

    <details class="panel" id="internal-section">
      <summary class="panel-header">🔒 Comptes internes / test <span class="chevron">▶</span></summary>
      <div class="panel-body"><div class="table-wrap" id="internal-table-wrap"></div></div>
    </details>

  </div>
</div>

<!-- Domaine fixe de l'espace agent : les appels vers /api/* utilisent toujours
     cette adresse absolue, pour ne jamais dépendre du domaine depuis lequel
     cette page a été chargée. -->
<script>
  var PRIVENCY_API_BASE = 'https://app.privency.fr';
</script>
<!-- ══════════ AUTH GUARD (Supabase) + garde-fou admin ══════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
(function () {
  const ADMIN_USER_ID = '79e4e432-2232-4d2c-b41d-8c7c907c4dec';

  // Client du compte actif de CET onglet (voir auth-client.js).
  const authClient = PrivencyAuth.getClient();

  // resolved : une seule décision (révéler, refuser ou rediriger), quel que
  // soit le premier signal arrivé (onAuthStateChange, getSession ou timeout).
  let resolved = false;

  function reveal() {
    const hide = document.getElementById('auth-guard-hide');
    if (hide) hide.remove();
    if (document.body) document.body.style.display = 'block';
  }

  function onDomReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  // Pas de session Supabase du tout : même garde de base que app.html.
  function denied() {
    if (resolved) return;
    resolved = true;
    window.location.replace('/login.html');
  }

  // Session valide mais utilisateur différent d'Olivier : garde-fou
  // d'affichage uniquement (la vraie sécurité est côté serveur, dans
  // api/admin-stats.js, qui revérifie l'id sur le JWT et renvoie 403).
  function forbidden() {
    if (resolved) return;
    resolved = true;
    reveal();
    onDomReady(function () {
      var root = document.getElementById('dash-root');
      if (root) {
        root.innerHTML = '<div class="forbidden-msg">⛔ Accès non autorisé — cette page est réservée.</div>';
      }
    });
    setTimeout(function () { window.location.replace('/dashboard.html'); }, 1800);
  }

  function checkAdmin(session) {
    if (resolved) return;
    resolved = true;
    if (!session.user || session.user.id !== ADMIN_USER_ID) {
      forbidden();
      return;
    }
    reveal();
    if (typeof window.initDashboard === 'function') {
      window.initDashboard(session);
    } else {
      window._pendingAdminSession = session;
    }
  }

  authClient.auth.onAuthStateChange(function (event, session) {
    if (session) checkAdmin(session); else denied();
  });

  authClient.auth.getSession().then(function (res) {
    var session = res.data && res.data.session ? res.data.session : null;
    if (session) checkAdmin(session); else denied();
  }).catch(denied);

  setTimeout(function () { denied(); }, 3000);
})();
</script>

<!-- ══════════ DASHBOARD — chargement et rendu des données ══════════ -->
<script>
function fmtEUR(n) {
  return Math.round(n || 0).toLocaleString('fr-FR') + ' €';
}
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch (e) {
    return '—';
  }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function statutBadge(agent) {
  var status = agent.en_essai ? 'essai' : (agent.subscription_status || 'inconnu');
  var cls = 'is-other';
  if (status === 'active' || status === 'essai') cls = 'is-active';
  else if (status === 'canceled' || status === 'incomplete_expired') cls = 'is-canceled';
  return '<span class="status-dot ' + cls + '">' + escapeHtml(status) + '</span>';
}
function nomReseauCell(agent) {
  var nomComplet = [agent.prenom, agent.nom].filter(Boolean).join(' ').trim();
  var nom = nomComplet ? escapeHtml(nomComplet) : '<span style="color:var(--muted);">—</span>';
  var reseau = agent.reseau ? '<span class="cell-sub">' + escapeHtml(agent.reseau) + '</span>' : '';
  return nom + reseau;
}
function agentRowHtml(agent) {
  return '<tr>'
    + '<td>' + nomReseauCell(agent) + '</td>'
    + '<td>' + escapeHtml(agent.email) + '</td>'
    + '<td>' + fmtDate(agent.created_at) + '</td>'
    + '<td>' + statutBadge(agent) + '</td>'
    + '<td>' + fmtEUR(agent.mrr) + '</td>'
    + '<td>' + (agent.nb_fiches || 0) + '</td>'
    + '<td>' + (agent.nb_vues || 0) + '</td>'
    + '<td>' + (agent.nb_offres || 0) + '</td>'
    + '<td>' + fmtDate(agent.derniere_activite) + '</td>'
    + '<td>' + (agent.profil_complete ? '✅ Oui' : '➖ Non') + '</td>'
    + '</tr>';
}
function tableHtml(agents) {
  var rows = agents.map(agentRowHtml).join('');
  return '<table class="table"><thead><tr>'
    + '<th>Nom / Réseau</th><th>Email</th><th>Inscription</th><th>Statut</th>'
    + '<th>CA mensuel</th><th>Fiches</th><th>Vues</th><th>Offres</th>'
    + '<th>Dernière activité</th><th>Profil complété</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function jours(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function dansJours(iso) {
  if (!iso) return null;
  return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
}
function nomCourt(a) {
  return [a.prenom, a.nom].filter(Boolean).join(' ').trim() || a.email || '—';
}
function ilYa(iso) {
  var j = jours(iso);
  if (j === null) return '—';
  if (j <= 0) return "aujourd'hui";
  return 'il y a ' + j + ' j';
}
function petiteTable(entetes, lignes, vide) {
  if (!lignes.length) return '<div class="panel-empty">' + vide + '</div>';
  return '<table class="table"><thead><tr>' + entetes.map(function (h) { return '<th>' + h + '</th>'; }).join('')
    + '</tr></thead><tbody>' + lignes.map(function (l) { return '<tr>' + l.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
}
var CAT_LBL = { idee: '<span class="badge badge-green">💡 Idée</span>', bug: '<span class="badge badge-amber">🐞 Problème</span>', remarque: '<span class="badge badge-green">💬 Remarque</span>' };
var _data = null, _session = null;

function showDetail(key) {
  var box = document.getElementById('kpi-detail');
  var tiles = document.querySelectorAll('#kpi-grid .kpi-tile');
  tiles.forEach(function (t) { t.classList.toggle('on', t.getAttribute('data-k') === key && box.getAttribute('data-k') !== key); });
  if (box.getAttribute('data-k') === key) { box.innerHTML = ''; box.removeAttribute('data-k'); return; }
  var clients = (_data.clients || []);
  var html = '', titre = '';
  if (key === 'revenu') {
    titre = 'Abonnés qui paient';
    html = petiteTable(['Agent', 'Depuis', 'Revenu mensuel'], clients.filter(function (a) { return a.mrr > 0; }).map(function (a) {
      return [escapeHtml(nomCourt(a)), fmtDate(a.created_at), fmtEUR(a.mrr)]; }), 'Aucun abonné payant pour l\'instant.');
  } else if (key === 'essais') {
    titre = 'Essais gratuits en cours';
    html = petiteTable(['Agent', 'Fin d\'essai', 'Fiches créées'], clients.filter(function (a) { return a.en_essai; }).sort(function (a, b) {
      return String(a.fin_essai || '').localeCompare(String(b.fin_essai || '')); }).map(function (a) {
      var d = dansJours(a.fin_essai);
      return [escapeHtml(nomCourt(a)), d === null ? '—' : (d <= 0 ? 'terminé' : 'dans ' + d + ' j') + ' (' + fmtDate(a.fin_essai) + ')',
        (a.nb_fiches || 0) + (a.nb_fiches ? '' : ' <span class="badge badge-amber">n\'a pas démarré</span>')]; }), 'Aucun essai en cours.');
  } else if (key === 'inactifs') {
    titre = 'Agents sans activité depuis 7 jours';
    html = petiteTable(['Agent', 'Dernière activité', 'Fiches', 'Statut'], inactifs(clients).map(function (a) {
      var der = [a.derniere_activite, a.derniere_maj_fiche].filter(Boolean).sort().pop();
      return [escapeHtml(nomCourt(a)), der ? ilYa(der) : 'jamais', a.nb_fiches || 0, statutBadge(a)]; }), 'Tous vos agents ont été actifs cette semaine.');
  } else if (key === 'abonnes') {
    titre = 'Abonnés actifs (qui paient)';
    html = petiteTable(['Agent', 'Inscription', 'Statut'], clients.filter(function (a) { return a.mrr > 0; }).map(function (a) {
      return [escapeHtml(nomCourt(a)), fmtDate(a.created_at), statutBadge(a)]; }), 'Aucun abonné payant pour l\'instant.');
  }
  box.setAttribute('data-k', key);
  box.innerHTML = '<div class="panel"><div class="panel-header">' + titre + '</div><div class="panel-body"><div class="table-wrap">' + html + '</div></div></div>';
}
function inactifs(clients) {
  // Agent payant ou en essai, sans aucune activité de ses clients depuis 7 jours.
  return clients.filter(function (a) {
    if (!(a.mrr > 0 || a.en_essai)) return false;
    if (jours(a.created_at) < 7) return false; // inscrit depuis moins d'une semaine : pas encore « inactif »
    var j = Math.min(jours(a.derniere_activite) == null ? 9999 : jours(a.derniere_activite), jours(a.derniere_maj_fiche) == null ? 9999 : jours(a.derniere_maj_fiche));
    return j >= 7;
  });
}

function renderDashboard(data) {
  _data = data;
  var totaux = data.totaux || {};
  var clients = data.clients || [];
  var essais = clients.filter(function (a) { return a.en_essai; });
  var prochainEssai = essais.map(function (a) { return dansJours(a.fin_essai); }).filter(function (d) { return d !== null; }).sort(function (a, b) { return a - b; })[0];
  var nbInactifs = inactifs(clients).length;
  var nbQ = (data.messages && data.messages.questions || []).length, nbI = (data.messages && data.messages.idees || []).length;
  var kpis = [
    { k: 'abonnes', label: 'Abonnés actifs', value: totaux.nb_clients_actifs || 0, sub: '+' + (totaux.nb_nouvelles_inscriptions_ce_mois || 0) + ' inscrit(s) ce mois-ci' },
    { k: 'revenu', label: 'Revenu mensuel (MRR)', value: fmtEUR(totaux.mrr_total), sub: data.stripe_ok === false ? '⚠️ Provisoire : essais non vérifiés (Stripe)' : fmtEUR(totaux.arr_total) + ' / an', warn: data.stripe_ok === false },
    { k: 'essais', label: 'En essai gratuit', value: totaux.nb_essais_en_cours || 0, sub: prochainEssai === undefined ? '' : (prochainEssai <= 0 ? 'Un essai se termine aujourd\'hui' : 'Prochaine fin d\'essai : dans ' + prochainEssai + ' j'), warn: prochainEssai !== undefined && prochainEssai <= 3 },
    { k: 'inactifs', label: 'Agents inactifs (7 j)', value: nbInactifs, sub: nbInactifs ? 'À relancer' : 'Tout le monde est actif', warn: nbInactifs > 0, alerte: nbInactifs > 0 },
    { k: 'msg', label: 'Messages (60 j)', value: nbQ + nbI, sub: nbQ + ' question(s) · ' + nbI + ' idée(s)', msg: true }
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(function (k) {
    return '<div class="kpi-tile clic' + (k.alerte ? ' alerte' : '') + '" data-k="' + k.k + '" role="button" tabindex="0">'
      + '<div class="kpi-label">' + escapeHtml(k.label) + '</div><div class="kpi-value">' + k.value + '</div>'
      + '<div class="kpi-sub' + (k.warn ? ' warn' : '') + '">' + escapeHtml(k.sub || '') + '</div>'
      + '<div class="kpi-more">' + (k.msg ? 'Voir ci-dessous ▾' : 'Voir le détail ▾') + '</div></div>';
  }).join('');
  document.querySelectorAll('#kpi-grid .kpi-tile').forEach(function (t) {
    t.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); } };
    t.onclick = function () {
      var k = t.getAttribute('data-k');
      if (k === 'msg') { document.getElementById('msg-questions').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      showDetail(k);
    };
  });
  document.getElementById('kpi-detail').innerHTML = '';

  var q = (data.messages && data.messages.questions) || [], idees = (data.messages && data.messages.idees) || [];
  document.getElementById('msg-questions').innerHTML = q.length ? q.map(function (m) {
    var bas = m.reponse
      ? '<div class="rep-ok">✅ Votre réponse <i>· ' + ilYa(m.repondu_at) + '</i><p>' + escapeHtml(m.reponse) + '</p></div>'
      : '<div class="rep-form"><textarea rows="2" placeholder="Votre réponse (l\'agent la verra dans son chatbot)…"></textarea><button type="button" class="btn btn-primary" data-id="' + escapeHtml(m.id) + '">Répondre</button></div>';
    return '<div class="msg"><b>' + escapeHtml(m.agent) + '</b> <i>· ' + ilYa(m.created_at) + '</i><p>' + escapeHtml(m.texte) + '</p>' + bas + '</div>'; }).join('')
    : '<div class="panel-empty">Aucune question pour l\'instant.</div>';
  document.querySelectorAll('#msg-questions .rep-form button').forEach(function (btn) {
    btn.onclick = async function () {
      var ta = btn.parentNode.querySelector('textarea'), txt = ta.value.trim();
      if (!txt) return;
      btn.disabled = true; btn.textContent = 'Envoi…';
      try {
        var res = await fetch(PRIVENCY_API_BASE + '/api/aide-repondre', { method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _session.access_token },
          body: JSON.stringify({ id: btn.getAttribute('data-id'), reponse: txt }) });
        var r = await res.json();
        if (!res.ok) throw new Error(r.error || ('Erreur ' + res.status));
        var item = (_data.messages.questions || []).filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (item) { item.reponse = txt; item.repondu_at = new Date().toISOString(); }
        renderDashboard(_data);
      } catch (e) { btn.disabled = false; btn.textContent = 'Répondre'; alert('Réponse non envoyée : ' + e.message); }
    };
  });
  document.getElementById('msg-idees').innerHTML = idees.length ? idees.map(function (m) {
    return '<div class="msg"><b>' + escapeHtml(m.agent) + '</b> ' + (CAT_LBL[m.categorie] || '') + ' <i>· ' + ilYa(m.created_at) + '</i><p>' + escapeHtml(m.texte) + '</p></div>'; }).join('')
    : '<div class="panel-empty">Aucune idée pour l\'instant.</div>';

  var tri = function (arr) { return arr.slice().sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); }); };
  var cl = tri(clients);
  document.getElementById('clients-table-wrap').innerHTML = cl.length ? tableHtml(cl) : '<div class="panel-empty">Aucun client actif pour l\'instant.</div>';
  var internes = tri(data.comptes_internes || []);
  document.getElementById('internal-table-wrap').innerHTML = internes.length ? tableHtml(internes) : '<div class="panel-empty">Aucun compte interne / test.</div>';
}

window.initDashboard = async function (session) {
  _session = session;
  var statusEl = document.getElementById('dash-status');
  var contentEl = document.getElementById('dash-content');
  statusEl.textContent = '⏳ Chargement des statistiques…';
  statusEl.style.display = 'block';
  contentEl.style.display = 'none';

  try {
    var res = await fetch(PRIVENCY_API_BASE + '/api/admin-stats', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    });
    var data = await res.json();

    if (!res.ok) {
      statusEl.textContent = res.status === 403
        ? '⛔ Accès non autorisé à ces statistiques.'
        : '❌ ' + (data.error || ('Erreur HTTP ' + res.status));
      statusEl.style.display = 'block';
      return;
    }

    renderDashboard(data);
    statusEl.style.display = 'none';
    contentEl.style.display = 'block';
  } catch (err) {
    statusEl.textContent = '❌ Erreur réseau : ' + (err.message || err);
    statusEl.style.display = 'block';
  }
};

if (window._pendingAdminSession) {
  window.initDashboard(window._pendingAdminSession);
}
</script>
</body>
</html>
