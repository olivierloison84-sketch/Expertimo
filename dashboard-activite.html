<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style id="auth-guard-hide">body { display: none !important; }</style>
<title>Privency Dashboard · Activité</title>
<meta name="theme-color" content="#0E9F6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css">
<style>
  body{background:var(--gray-50)}

  header{
    background:var(--white);
    border-bottom:1px solid var(--gray-200);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
  }

  .header-brand{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .logo-circle{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--brand-50);
    color:var(--brand-700);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:16px;
    flex-shrink:0;
  }

  .header-brand h1{
    font-size:var(--text-lg);
    font-weight:700;
    color:var(--ink);
    margin:0;
  }

  .header-brand p{
    font-size:var(--text-xs);
    color:var(--muted);
    margin-top:1px;
  }

  .container{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  #dash-status{
    text-align:center;
    color:var(--muted);
    font-size:var(--text-sm);
    padding:60px 20px;
  }

  .forbidden-msg{
    max-width:480px;
    margin:80px auto;
    text-align:center;
    background:var(--red-50);
    border:1px solid rgba(240,68,56,.3);
    border-radius:var(--r-lg);
    padding:32px 24px;
    color:#b42318;
    font-weight:600;
  }

  #kpi-grid{
    margin-bottom:var(--s-6);
  }

  @media(max-width: 700px){
    #kpi-grid{grid-template-columns:repeat(2, 1fr)}
  }
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
  <div class="header-brand">
    <div class="logo-circle">P</div>
    <div>
      <h1>Dashboard Activité</h1>
      <p>Vue d'ensemble des comptes agents Privency</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="switch-account-btn" class="btn btn-ghost" onclick="PrivencyAuth.switchAccount();">Changer de compte</button>
    <button id="logout-btn" class="btn btn-ghost" onclick="PrivencyAuth.signOutActive().then(function(){ window.location.replace('/login.html'); });">Déconnexion</button>
  </div>
</header>

<div class="container" id="dash-root">
  <div id="dash-status">⏳ Chargement des statistiques…</div>

  <div id="dash-content" style="display:none;">

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="panel">
      <div class="panel-header">👥 Clients</div>
      <div class="panel-body">
        <div class="table-wrap" id="clients-table-wrap"></div>
      </div>
    </div>

    <details class="panel" id="internal-section">
      <summary class="panel-header">
        🔒 Comptes internes / test
        <span class="chevron">▶</span>
      </summary>
      <div class="panel-body">
        <div class="table-wrap" id="internal-table-wrap"></div>
      </div>
    </details>

  </div>
</div>

<!-- Domaine fixe de l'espace agent : les appels vers /api/* utilisent toujours
     cette adresse absolue, pour ne jamais dépendre du domaine depuis lequel
     cette page a été chargée. -->
<script>
  var PRIVENCY_API_BASE = 'https://app.privency.fr';
</script>
<!-- ══════════ AUTH GUARD (Supabase) + garde-fou admin ══════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
(function () {
  const ADMIN_USER_ID = '79e4e432-2232-4d2c-b41d-8c7c907c4dec';

  // Client du compte actif de CET onglet (voir auth-client.js).
  const authClient = PrivencyAuth.getClient();

  // resolved : une seule décision (révéler, refuser ou rediriger), quel que
  // soit le premier signal arrivé (onAuthStateChange, getSession ou timeout).
  let resolved = false;

  function reveal() {
    const hide = document.getElementById('auth-guard-hide');
    if (hide) hide.remove();
    if (document.body) document.body.style.display = 'block';
  }

  function onDomReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  // Pas de session Supabase du tout : même garde de base que app.html.
  function denied() {
    if (resolved) return;
    resolved = true;
    window.location.replace('/login.html');
  }

  // Session valide mais utilisateur différent d'Olivier : garde-fou
  // d'affichage uniquement (la vraie sécurité est côté serveur, dans
  // api/admin-stats.js, qui revérifie l'id sur le JWT et renvoie 403).
  function forbidden() {
    if (resolved) return;
    resolved = true;
    reveal();
    onDomReady(function () {
      var root = document.getElementById('dash-root');
      if (root) {
        root.innerHTML = '<div class="forbidden-msg">⛔ Accès non autorisé — cette page est réservée.</div>';
      }
    });
    setTimeout(function () { window.location.replace('/dashboard.html'); }, 1800);
  }

  function checkAdmin(session) {
    if (resolved) return;
    resolved = true;
    if (!session.user || session.user.id !== ADMIN_USER_ID) {
      forbidden();
      return;
    }
    reveal();
    if (typeof window.initDashboard === 'function') {
      window.initDashboard(session);
    } else {
      window._pendingAdminSession = session;
    }
  }

  authClient.auth.onAuthStateChange(function (event, session) {
    if (session) checkAdmin(session); else denied();
  });

  authClient.auth.getSession().then(function (res) {
    var session = res.data && res.data.session ? res.data.session : null;
    if (session) checkAdmin(session); else denied();
  }).catch(denied);

  setTimeout(function () { denied(); }, 3000);
})();
</script>

<!-- ══════════ DASHBOARD — chargement et rendu des données ══════════ -->
<script>
function fmtEUR(n) {
  return Math.round(n || 0).toLocaleString('fr-FR') + ' €';
}
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch (e) {
    return '—';
  }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function statutBadge(agent) {
  var status = agent.subscription_status || 'inconnu';
  var cls = 'is-other';
  if (status === 'active') cls = 'is-active';
  else if (status === 'canceled' || status === 'incomplete_expired') cls = 'is-canceled';
  return '<span class="status-dot ' + cls + '">' + escapeHtml(status) + '</span>';
}
function nomReseauCell(agent) {
  var nomComplet = [agent.prenom, agent.nom].filter(Boolean).join(' ').trim();
  var nom = nomComplet || '<span style="color:var(--muted);">—</span>';
  var reseau = agent.reseau ? '<span class="cell-sub">' + escapeHtml(agent.reseau) + '</span>' : '';
  return nom + reseau;
}
function agentRowHtml(agent) {
  return '<tr>'
    + '<td>' + nomReseauCell(agent) + '</td>'
    + '<td>' + escapeHtml(agent.email) + '</td>'
    + '<td>' + fmtDate(agent.created_at) + '</td>'
    + '<td>' + statutBadge(agent) + '</td>'
    + '<td>' + fmtEUR(agent.mrr) + '</td>'
    + '<td>' + (agent.nb_fiches || 0) + '</td>'
    + '<td>' + (agent.nb_vues || 0) + '</td>'
    + '<td>' + (agent.nb_offres || 0) + '</td>'
    + '<td>' + fmtDate(agent.derniere_activite) + '</td>'
    + '<td>' + (agent.profil_complete ? '✅ Oui' : '➖ Non') + '</td>'
    + '</tr>';
}
function tableHtml(agents) {
  var rows = agents.map(agentRowHtml).join('');
  return '<table class="table"><thead><tr>'
    + '<th>Nom / Réseau</th><th>Email</th><th>Inscription</th><th>Statut</th>'
    + '<th>CA mensuel</th><th>Fiches</th><th>Vues</th><th>Offres</th>'
    + '<th>Dernière activité</th><th>Profil complété</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderDashboard(data) {
  var totaux = data.totaux || {};
  var kpis = [
    { label: 'MRR', value: fmtEUR(totaux.mrr_total) },
    { label: 'ARR', value: fmtEUR(totaux.arr_total) },
    { label: 'Clients actifs', value: totaux.nb_clients_actifs || 0 },
    { label: 'Nouvelles inscriptions (mois)', value: totaux.nb_nouvelles_inscriptions_ce_mois || 0 },
    { label: 'Fiches créées', value: totaux.nb_fiches_total || 0 },
    { label: 'Vues totales', value: totaux.nb_vues_total || 0 },
    { label: 'Offres soumises', value: totaux.nb_offres_total || 0 }
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(function (k) {
    return '<div class="kpi-tile"><div class="kpi-label">' + escapeHtml(k.label) + '</div>'
      + '<div class="kpi-value">' + k.value + '</div></div>';
  }).join('');

  var clients = (data.clients || []).slice().sort(function (a, b) {
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  var clientsWrap = document.getElementById('clients-table-wrap');
  if (clients.length === 0) {
    clientsWrap.innerHTML = '<div class="panel-empty">Aucun client actif pour l\'instant.</div>';
  } else {
    clientsWrap.innerHTML = tableHtml(clients);
  }

  var internes = (data.comptes_internes || []).slice().sort(function (a, b) {
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  var internalWrap = document.getElementById('internal-table-wrap');
  internalWrap.innerHTML = internes.length === 0
    ? '<div class="panel-empty">Aucun compte interne / test.</div>'
    : tableHtml(internes);
}

window.initDashboard = async function (session) {
  var statusEl = document.getElementById('dash-status');
  var contentEl = document.getElementById('dash-content');
  statusEl.textContent = '⏳ Chargement des statistiques…';
  statusEl.style.display = 'block';
  contentEl.style.display = 'none';

  try {
    var res = await fetch(PRIVENCY_API_BASE + '/api/admin-stats', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    });
    var data = await res.json();

    if (!res.ok) {
      statusEl.textContent = res.status === 403
        ? '⛔ Accès non autorisé à ces statistiques.'
        : '❌ ' + (data.error || ('Erreur HTTP ' + res.status));
      statusEl.style.display = 'block';
      return;
    }

    renderDashboard(data);
    statusEl.style.display = 'none';
    contentEl.style.display = 'block';
  } catch (err) {
    statusEl.textContent = '❌ Erreur réseau : ' + (err.message || err);
    statusEl.style.display = 'block';
  }
};

if (window._pendingAdminSession) {
  window.initDashboard(window._pendingAdminSession);
}
</script>
</body>
</html>
