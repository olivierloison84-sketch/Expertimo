<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style id="auth-guard-hide">body { display: none !important; }</style>
<title>Tableau de bord — Privency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css">
<style>
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--gray-50);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    background:var(--white);
    border-bottom:1px solid var(--gray-200);
  }

  .logo{
    font-weight:800;
    font-size:1.25rem;
    letter-spacing:-.02em;
    color:var(--ink);
  }

  .logo b{
    color:var(--brand-500);
    font-weight:800;
  }

  .header-actions{
    display:flex;
    gap:8px;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }

  .welcome{
    text-align:center;
    margin-bottom:var(--s-6);
  }

  .welcome h1{
    margin:0;
  }

  .welcome h1 b{
    color:var(--brand-500);
    font-weight:800;
  }

  .welcome p{
    margin-top:8px;
    font-size:var(--text-sm);
    color:var(--muted);
  }

  .dash-card{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:var(--s-4);
  }

  .dash-card .hint{
    font-size:var(--text-sm);
    color:var(--muted);
    margin:0;
  }
</style>
<!-- Domaine fixe de l'espace agent : les appels vers /api/* utilisent toujours
     cette adresse absolue, pour ne jamais dépendre du domaine depuis lequel
     cette page a été chargée (ex: si elle est ouverte par erreur depuis
     espace.privency.fr, réservé aux fiches publiées). -->
<script>
  var PRIVENCY_API_BASE = 'https://app.privency.fr';
</script>
<!-- ══════════ AUTH GUARD (Supabase) ══════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
(function () {
  // Client du compte actif de CET onglet (voir auth-client.js).
  const authClient = PrivencyAuth.getClient();
  window.privencySession = null;

  // resolved : une seule décision (révéler ou rediriger), quel que soit le
  // premier signal arrivé (onAuthStateChange, getSession ou timeout).
  let resolved = false;

  function reveal(session) {
    if (resolved) return;
    resolved = true;
    window.privencySession = session;
    PrivencyAuth.refreshTitle(session);
    // Une règle !important en feuille de style ne peut pas être surpassée
    // par un style inline : on supprime la balise <style> du voile.
    const apply = () => {
      const hide = document.getElementById('auth-guard-hide');
      if (hide) hide.remove();
      if (document.body) document.body.style.display = 'flex';
      document.dispatchEvent(new CustomEvent('privency:session', { detail: session }));
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else {
      apply();
    }
  }

  function denied() {
    if (resolved) return;
    resolved = true;
    window.location.replace('/login.html');
  }

  // Signal principal : onAuthStateChange émet INITIAL_SESSION au chargement
  // une fois la session restaurée (ou confirmée absente) depuis le storage.
  authClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      reveal(session);
    } else if (event === 'SIGNED_OUT' && resolved) {
      if (window.__privencyLoggingOut) return; // déconnexion lancée depuis cet onglet : le bouton redirige déjà
      // Déconnexion du même compte depuis un autre onglet : on quitte la page.
      // Le signal peut venir d'un autre onglet du même compte (BroadcastChannel du storageKey) :
      // on ne quitte la page que si NOTRE session (localStorage ou sessionStorage) a vraiment disparu.
      authClient.auth.getSession().then(function (r) {
        if (!(r && r.data && r.data.session)) window.location.replace('/login.html');
      });
    } else {
      denied();
    }
  });

  // Fallback : getSession() en parallèle, et couperet à 3 secondes si
  // aucun des deux signaux n'a confirmé de session d'ici là.
  authClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      reveal(session);
    } else {
      denied();
    }
  }).catch(denied);

  setTimeout(() => { denied(); }, 3000);
})();
</script>
<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "yfjfjzv3a2");</script></head>
<body>

<header>
  <div class="logo">Priven<b>cy</b></div>
  <div class="header-actions">
    <button type="button" class="btn btn-ghost" id="switch-account-btn">Changer de compte</button>
    <button type="button" class="btn btn-ghost" id="logout-btn">Déconnexion</button>
  </div>
</header>

<main>
  <div class="welcome">
    <h1 class="h2">Bienvenue, <b id="user-name">…</b></h1>
    <p>Votre espace immobilier professionnel</p>
  </div>

  <div class="card dash-card">
    <p class="hint">Première utilisation ? Activez votre abonnement pour commencer.</p>
    <a href="/app.html" class="btn btn-primary btn-block">Accéder au générateur</a>
    <button type="button" class="btn btn-secondary btn-block" id="subscribe-btn">Activer mon abonnement</button>
    <div class="alert alert-error" id="error-message"></div>
  </div>
</main>

<script>
(function () {
  const subscribeBtn = document.getElementById('subscribe-btn');
  const errorMessage = document.getElementById('error-message');
  let subscriptionActive = false;

  function capitalizeName(s){ return (s||'').trim().split(/\s+/).map(w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' '); }

  function showUser(session) {
    const meta = (session && session.user && session.user.user_metadata) || {};
    const fullName = [capitalizeName(meta.prenom), capitalizeName(meta.nom)].filter(Boolean).join(' ');
    document.getElementById('user-name').textContent = fullName || (session && session.user && session.user.email) || '';
  }

  async function checkSubscription(session) {
    try {
      const { data, error } = await window.privencyAuth
        .from('agents')
        .select('subscription_status')
        .eq('id', session.user.id)
        .single();
      subscriptionActive = !error && !!data && data.subscription_status === 'active';
    } catch (e) {
      subscriptionActive = false;
    }
    subscribeBtn.textContent = subscriptionActive ? 'Gérer mon abonnement' : 'Activer mon abonnement';
  }

  if (window.privencySession) {
    showUser(window.privencySession);
    checkSubscription(window.privencySession);
  } else {
    document.addEventListener('privency:session', (e) => {
      showUser(e.detail);
      checkSubscription(e.detail);
    });
  }

  subscribeBtn.addEventListener('click', async () => {
    const session = window.privencySession;
    if (!session) return;

    errorMessage.classList.remove('visible');
    errorMessage.textContent = '';
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = subscriptionActive ? 'Redirection vers la gestion de l’abonnement…' : 'Redirection vers le paiement…';

    try {
      const endpoint = subscriptionActive ? '/api/create-portal-session' : '/api/create-checkout';
      const body = subscriptionActive
        ? { user_id: session.user.id }
        : { user_id: session.user.id, email: session.user.email };

      const response = await fetch(PRIVENCY_API_BASE + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok || !data.url) {
        throw new Error(data.error || 'Impossible de créer la session.');
      }

      window.location.href = data.url;
    } catch (err) {
      errorMessage.textContent = err.message || 'Une erreur est survenue. Veuillez réessayer.';
      errorMessage.classList.add('visible');
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = subscriptionActive ? 'Gérer mon abonnement' : 'Activer mon abonnement';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    // Ne déconnecte que le compte de cet onglet.
    await PrivencyAuth.signOutActive();
    window.location.replace('/login.html');
  });

  document.getElementById('switch-account-btn').addEventListener('click', () => {
    PrivencyAuth.switchAccount();
  });
})();
</script>

</body>
</html>
